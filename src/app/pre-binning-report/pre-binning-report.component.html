<section>
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="px-4 pt-2">
          <app-report-toolbar [searchValue]="searchTerm" [activeFilterCount]="activeFilterCount"
            searchPlaceholder="Search by GRN No, Warehouse, Item Code, Item Name, Bin ID..."
            (searchChange)="onSearchChange($event)" (filterClick)="openSidebar()"
            (exportClick)="export($event)" (clearAll)="clear()"></app-report-toolbar>
        </div>
        <div>
          <app-report-table [columns]="columns" [rows]="rows" [loading]="loading" [page]="page" [pageSize]="pageSize"
            [totalRecords]="totalRecords" [totalPages]="totalPages" [sortBy]="sortBy" [sortDir]="sortDir" [totals]="totals"
            (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)"></app-report-table>
        </div>
      </div>
    </div>
  </div>
</section>

<div *ngIf="flagset" class="dialog_scrim" (click)="falseSet()"></div>

<section class="sidebar close sidebar_Request" id="sidebar">
  <div class="container-fluid" [formGroup]="filterForm">
    <div class="row d-inline">
      <div class="justify-content-between align-items-center d-flex">
        <div>
          <p class="storage_filter">Pre-Binning Report Filter</p>
        </div>
        <div>
          <button class="button closesidebar" (click)="closesidebar()">
            <span class="button-content" aria-hidden="true">&times;</span>
          </button>
        </div>
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="grnNo">GRN No :</label>
        <input type="text" id="grnNo" class="form-control" formControlName="grnNo">
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="whsCode">Warehouse :</label>
        <input type="text" id="whsCode" class="form-control" formControlName="whsCode">
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="itemCode">Item Code :</label>
        <input type="text" id="itemCode" class="form-control" formControlName="itemCode">
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="itemName">Item Name :</label>
        <input type="text" id="itemName" class="form-control" formControlName="itemName">
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="binId">Bin ID :</label>
        <input type="text" id="binId" class="form-control" formControlName="binId">
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="status">Status :</label>
        <select id="status" class="form-control" formControlName="status">
          <option value="">All</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="fromDate">From Date :</label>
        <input type="date" id="fromDate" class="form-control" formControlName="fromDate">
      </div>

      <div class="positionset p-2 py-3">
        <label class="filter_label w-100" for="toDate">To Date :</label>
        <input type="date" id="toDate" class="form-control" formControlName="toDate">
      </div>

      <div class="positionset p-2 py-3 d-flex justify-content-end align-items-center">
        <button class="button" (click)="searchData()">
          <span class="button-content">Apply</span>
        </button>
        <button class="button ml-3" (click)="clear()">
          <span class="button-content">Clear</span>
        </button>
      </div>
    </div>
  </div>
</section>
