<section>
  <div class="container-fluid w-100" class="login_section">
    <div class="row "> 
      <div class="col-6 d-grid align-items-center applyCSSLeft pr-0">
          <div class="blur htset">
            <div class="blur_bg2 pt-2">
              <div class="justify-content-center align-items-center d-flex pt-4">
                <img class="login_logo" alt="logo" src="./assets/images/Uathayam_logo.png" />
              </div>
              <div class="justify-content-center align-items-center d-flex py-4 px-4">
                <p class="system pt-2">Warehouse Management System V-{{appVesrion}}</p>
              </div>
              <div class="justify-content-center align-items-center d-flex  pb-2 ">
                <p class="company_name">B and B Textiles <sup>tm</sup></p>
              </div>
            </div>
          </div>
      </div>
      
      <div class="col-6 pl-0 d-grid align-items-center applycSSS">
        <div class="login_form htset">
          <div class="d-flex justify-content-center align-items-center pt-4">
            <p class="login_title">Login</p>
          </div>
          <div>
            <form [formGroup]="loginForm">
              <div class="input-group justify-content-center pb-4">
                <div class="input-group-prepend">
                  <span class="input-group-text" id="basic-addon1"><i class="fa fa-user"></i></span>
                </div>
                <div class="comdiv">
                  <input #username formControlName="username" type="text" class="form-control" placeholder="Username"
                    aria-label="Username" aria-describedby="basic-addon"
                    (keydown.enter)="moveFocus('username',password)"
                    [ngClass]="{ 'is-invalid': submitted && f['username'].errors }">
                  <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
                    <div class="fieldMandatory" *ngIf="f['username'].errors['required'] && f['username'].touched">
                      Username is required</div>
                  </div>
                </div>
              </div>
              <div class="input-group justify-content-center pb-4">
                <div class="input-group-prepend">
                  <span class="input-group-text" id="basic-addon1"><i class="fa fa-lock"></i></span>
                </div>
                <div class="comdiv">
                  <div class="input-group inpt">
                    <input #password formControlName="password" type="{{ showPassword ? 'text' : 'password' }}" class="form-control fc"
                      placeholder="Password" aria-label="Password" aria-describedby="toggle-password"
                      (keydown.enter)="moveFocus('password',loginBtn)"
                      [ngClass]="{ 'is-invalid': submitted && f['password'].errors }">
                    <i class="fa fa-eye setpos"
                       (mousedown)="showPassword = true"
                       (mouseup)="showPassword = false"
                       (mouseleave)="showPassword = false"
                       [class.fa-eye-slash]="showPassword"
                       [class.fa-eye]="!showPassword"
                       aria-hidden="true"></i>
                  </div>
                  <div *ngIf="submitted && f['password'].errors" class="invalid-feedback2 pt-2">
                    <div class="fieldMandatory" *ngIf="f['password'].errors['required'] && f['password'].touched">
                      Password is required
                    </div>
                  </div>
                </div>
                 
              </div>
              <div class="form-group justify-content-center align-items-center d-flex mb-2 pb-5">
                <div class="row">
                  <button #loginbtn (click)="login()" class=" btn btn-login d-flex justify-content-center align-items-center mr-4">Login</button>
                  <button class="btn btn-login  d-flex justify-content-center align-items-center ml-4" (click)="clearForm()">Clear</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
