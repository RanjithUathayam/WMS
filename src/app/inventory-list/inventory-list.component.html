<section>
  <div class="container-fluid px-0">
    <div class="row mx-1">
      <div class="col-12 p-0">
        <span class="refreshDate">Last Updated On: &nbsp;
          <!-- Full date format for large screens and above -->
          <span class="setDate d-none d-xl-block">{{ lastUpdatedDateTime | date: 'dd-MM-yyyy hh:mm:ss a' }}</span>
        
          <!-- Only time format for medium screens -->
          <span class="setDate d-none d-sm-block d-xl-none">{{ lastUpdatedDateTime | date: 'hh:mm:ss a' }}</span> 
          &nbsp;&nbsp;
          
          <button class="button refresh-button" (click)="searchData()">
            <span class="button-content setbtncontent">
              <i class="fa fa-refresh mr-1" aria-hidden="true"></i>
            </span>
          </button>
        </span>
        <div>
          <app-dynamic-table [tableHeader]="tableHeader" [tableData]="tableData" [exportTitle]="exportTitle"
            [exportApi]="searchApiCall" [inventoryType]="selected_type" [totRec]="TotalRecords"
            [isShowExportBtn]="isShowExportBtn"></app-dynamic-table>
        </div>
      </div>
    </div>
  </div>
</section>
